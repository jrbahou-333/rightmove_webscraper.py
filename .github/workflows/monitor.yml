name: Rightmove monitor

on:
  schedule:
    # Every 2 hours, 07:00-21:00 UTC == 08:00-22:00 UK time during BST.
    # GitHub cron is always UTC; this shifts to 07:00-21:00 local in winter (GMT).
    - cron: '0 7-21/2 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # DATABASE_URL / TELEGRAM_* are stored as environment secrets on the "env"
    # environment; the job must declare it to be able to read them.
    environment: env

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        # Always run this branch's code, even when triggered from the default
        # branch (e.g. by the schedule).
        ref: feature/adding_db_functionality

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run monitor
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -m src.monitor
